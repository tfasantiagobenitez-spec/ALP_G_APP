name: Tests del motor de cálculo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar todas las suites
        run: node test/todos.js
